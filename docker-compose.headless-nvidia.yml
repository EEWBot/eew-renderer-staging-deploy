services:
  eewrendererstg:
    image: ghcr.io/eewbot/eew-renderer:dev@sha256:d7a7f490a5643f2032e79dc6e7192b2c5837f4a9df644be31474d7e6fc364e61
    hostname: eewrenderer
    container_name: eewrendererstg${VARIANT:-}__eewrendererstg
    restart: unless-stopped

    environment:
      CLIENT_IP_SOURCE: CfConnectingIp
      LISTEN: 0.0.0.0:3000
      HMAC_KEY: ${HMAC_KEY}
      INSTANCE_NAME: ${INSTANCE_NAME}
      MINIMUM_RESPONSE_INTERVAL: ${MINIMUM_RESPONSE_INTERVAL:-200ms}
      IMAGE_CACHE_CAPACITY: ${IMAGE_CACHE_CAPACITY:-512}
      EGL_DEVICE_INDEX: ${EGL_DEVICE_INDEX:-0}

    command: /usr/bin/eew-renderer

    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [graphics]

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    hostname: cloudflared
    container_name: eewrendererstg${VARIANT:-}__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      - default

networks:
  default:
    name: eewrendererstg${VARIANT:-}__default
