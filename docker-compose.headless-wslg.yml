services:
  eewrendererstg:
    image: ghcr.io/eewbot/eew-renderer:dev@sha256:b752e3b14a7d193b65f0dbaf9e24bf312fd5143263459d505f4f31dc47183534
    hostname: eewrenderer
    container_name: eewrendererstg${VARIANT:-}__eewrendererstg
    restart: unless-stopped

    environment:
      LISTEN: 0.0.0.0:3000
      ALLOW_DEMO: ${ALLOW_DEMO:-false}
      HMAC_KEY: ${HMAC_KEY}
      INSTANCE_NAME: ${INSTANCE_NAME}
      MINIMUM_RESPONSE_INTERVAL: ${MINIMUM_RESPONSE_INTERVAL}
      HEADLESS: true
      IMAGE_CACHE_CAPACITY: ${IMAGE_CACHE_CAPACITY:-512}
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: d3d12

    command: /usr/bin/eew-renderer

    devices:
      - /dev/dxg:/dev/dxg

    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro

    deploy:
      resources:
        limits:
          memory: 2g

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    hostname: cloudflared
    container_name: eewrendererstg${VARIANT:-}__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      - default

networks:
  default:
    name: eewrendererstg${VARIANT:-}__default
